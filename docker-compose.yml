# Optional: run MySQL 8 in Docker instead of a local install.
# Usage: copy .env.example to .env, fill in passwords, then `docker compose up -d`
services:
  mysql:
    image: mysql:8.4
    container_name: meet2action-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meet2action}
      MYSQL_USER: ${MYSQL_USER:-meet2action_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
